name: Web Apps — Lint, Types & Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/design-system/industry/web/**'
      - 'packages/design-system/industry/tokens/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'

jobs:
  finance-app:
    name: finance-app — lint, check-types, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npx yarn install

      - name: Build @industry/tokens and @industry/web
        run: yarn workspace @industry/tokens build && yarn workspace @industry/web build

      - name: Lint
        run: yarn workspace @app/finance lint

      - name: Check types
        run: yarn workspace @app/finance check-types

      - name: Test
        run: yarn workspace @app/finance test --runInBand

      - name: Build stays under the Vercel upload limit
        run: |
          yarn workspace @app/finance build
          count=$(find apps/web/finance-app/dist -type f | wc -l)
          echo "finance-app build: $count files"
          if [ "$count" -gt 200 ]; then
            echo "::error::The build has $count files; the Vercel free plan accepts 5000 uploads a day, so keep it under 200."
            exit 1
          fi

  finance-app-rules:
    name: finance-app — Firestore rules (emulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npx yarn install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Test Firestore rules
        run: yarn workspace @app/finance test:rules
