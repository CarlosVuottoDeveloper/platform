name: Test Coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/tickets-app/**'
      - 'apps/mobile/appointmate/**'
      - 'apps/web/finance-app/**'
      - 'packages/design-system/industry/mobile/**'
      - 'packages/design-system/industry/web/**'
      - 'packages/design-system/industry/tokens/**'

jobs:
  coverage:
    name: Coverage ≥ 95% on changed files (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tickets-app
            path: apps/mobile/tickets-app
            build: yarn workspace @industry/tokens build && yarn workspace @industry/mobile build
            exclude_pattern: ''
          - name: appointmate
            path: apps/mobile/appointmate
            build: yarn workspace @industry/tokens build && yarn workspace @industry/mobile build
            exclude_pattern: ''
          - name: finance-app
            path: apps/web/finance-app
            build: yarn workspace @industry/tokens build && yarn workspace @industry/web build
            # main.tsx only mounts the app, firebase.ts only initializes the SDK at module load and firebaseConfig.ts only reads
            # import.meta.env, which Jest's CommonJS transform cannot parse.
            exclude_pattern: 'src/main\.tsx$|vite\.config\.ts$|services/firebase(Config)?\.ts$'
          - name: industry-mobile
            path: packages/design-system/industry/mobile
            build: yarn workspace @industry/tokens build
            # Storybook story files are documentation, not unit-testable.
            # manager.ts/theme.ts are Storybook wiring (setConfig + a theme
            # literal) with nothing to assert; preview.tsx stays in the gate
            # because its decorator holds real logic and is tested.
            exclude_pattern: '\.stories\.|\.storybook/(manager|theme)\.ts$'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npx yarn install

      - name: Build dependencies
        run: ${{ matrix.build }}

      - name: Identify changed source files
        id: changed
        env:
          WORKSPACE_PATH: ${{ matrix.path }}
          EXCLUDE_PATTERN: ${{ matrix.exclude_pattern }}
        run: |
          # -M100% + --diff-filter=ACM: a byte-identical file that only moved
          # (e.g. a package folder rename) is reported as a pure rename (R)
          # and excluded, instead of inflating this list with every
          # untouched file in the new path. Any file with real content
          # changes falls below the 100% similarity threshold and is
          # reported as Added, so it's still included.
          #
          # Exclude test files.
          # || true prevents grep's exit code 1 (no match) from failing the
          # step when pipefail is active (GitHub Actions default shell)
          FILES=$(git diff --name-only -M100% --diff-filter=ACM ${{ github.event.pull_request.base.sha }}...HEAD \
            | grep -E "^${WORKSPACE_PATH}/.*\.(ts|tsx)$" \
            | grep -Ev '\.(spec|test)\.' \
            || true)

          if [ -n "$EXCLUDE_PATTERN" ]; then
            FILES=$(echo "$FILES" | grep -Ev "$EXCLUDE_PATTERN" || true)
          fi

          if [ -z "$FILES" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No testable source files changed — skipping coverage check."
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "Files to check:"
            echo "$FILES"
            echo "$FILES" > /tmp/changed_files.txt
          fi

      - name: Run Jest with coverage on changed files
        if: steps.changed.outputs.has_files == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          # Paths relative to this working directory (strip the repo prefix)
          CHANGED=$(sed "s|${{ matrix.path }}/||" /tmp/changed_files.txt | tr '\n' ' ')
          COLLECT=$(sed "s|${{ matrix.path }}/||" /tmp/changed_files.txt \
            | awk '{print "--collectCoverageFrom=" $0}' \
            | tr '\n' ' ')

          # --findRelatedTests runs only the test suites that import the changed
          # files, instead of the full test suite. --collectCoverageFrom limits
          # the coverage report to those same files.
          eval "yarn jest \
            --findRelatedTests $CHANGED \
            --coverage \
            --coverageReporters=json-summary \
            $COLLECT"

      - name: Enforce 95% threshold
        if: steps.changed.outputs.has_files == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
            const total = summary.total;
            const metrics = ['lines', 'statements', 'functions', 'branches'];
            let failed = false;

            for (const m of metrics) {
              const pct = total[m].pct;
              const pass = pct >= 95;
              console.log((pass ? '✓' : '✗') + ' ' + m + ': ' + pct + '%');
              if (!pass) failed = true;
            }

            if (failed) {
              console.error('\nCoverage below 95% on changed files. Add tests to reach the threshold.');
              process.exit(1);
            }

            console.log('\nAll coverage checks passed.');
          "
