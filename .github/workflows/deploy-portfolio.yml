name: Portfolio — Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/portfolio/**'
      - 'packages/design-system/industry/web/**'
      - 'packages/design-system/industry/tokens/**'
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    name: Portfolio → Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTFOLIO }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required configuration
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTFOLIO }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Install dependencies
        run: npx yarn install

      - name: Build @industry/tokens and @industry/web
        run: yarn workspace @industry/tokens build && yarn workspace @industry/web build

      - name: Build portfolio
        run: yarn workspace @app/portfolio build

      - name: Install Vercel CLI
        run: npm install -g vercel@65.16.0

      - name: Pull Vercel environment
        working-directory: apps/web/portfolio
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Stage prebuilt output
        working-directory: apps/web/portfolio
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Deploy to Vercel
        id: deploy
        working-directory: apps/web/portfolio
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Add URL to job summary
        run: |
          echo "## Portfolio" >> $GITHUB_STEP_SUMMARY
          echo "[${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
