    <use href="#card-shape" fill="none" stroke="url(#card-sheen)" stroke-width="4"/>
    <use href="#pulse-check" fill="none" stroke="#021f42" stroke-opacity="0.32" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 14)"/>
    <use href="#pulse-check" fill="none" stroke="#F2F5FA" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="644" cy="444" r="56" fill="#00bac9"/>
    <path d="M619 446 L637 464 L671 427" fill="none" stroke="#070B1F" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
