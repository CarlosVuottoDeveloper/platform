<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a7ff"/>
      <stop offset="1" stop-color="#026fd7"/>
    </linearGradient>
    <linearGradient id="card-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5FA" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#F2F5FA" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="56"/>
    </filter>
    <rect id="card-shape" x="296" y="296" width="432" height="432" rx="124"/>
    <path id="pulse-check" d="M352 540 H410 L450 428 L500 622 L538 544 L572 580 L640 480"/>
  </defs>
  <g id="check-in">
